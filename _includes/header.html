<head>
    <!--Site Title-->
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta charset="utf-8">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="theme-color" content="#0a0e17">

    <!--Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="{{ BASE_PATH }}/images/favicon.ico" type="image/x-icon">

    <!--Stylesheets -->
    <link rel="stylesheet" href="{{ BASE_PATH }}/css/bootstrap.css">
    <link rel="stylesheet" href="{{ BASE_PATH }}/css/fonts.css">
    <link rel="stylesheet" href="{{ BASE_PATH }}/css/style.css">
    <link rel="stylesheet" href="{{ BASE_PATH }}/css/xpixel-redesign.css">
